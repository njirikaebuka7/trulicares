<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TruliCares API Service Status</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.15);
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Grid Background Effect */
    .grid-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 30px 30px;
      z-index: 1;
    }

    /* Radial glow in center */
    .radial-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.08) 0%, transparent 70%);
      z-index: 2;
      pointer-events: none;
    }

    .card {
      position: relative;
      z-index: 3;
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 48px;
      width: 90%;
      max-width: 520px;
      text-align: center;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .logo-container {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      font-size: 20px;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
    }

    .logo-text {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #f8fafc 30%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: var(--accent-glow);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 8px 18px;
      border-radius: 99px;
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 28px;
      letter-spacing: 0.5px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent);
      animation: pulse 1.8s infinite;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text-main);
    }

    p {
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .divider {
      height: 1px;
      background-color: var(--border);
      width: 100%;
      margin-bottom: 24px;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      text-align: left;
    }

    .meta-item {
      background-color: rgba(15, 23, 42, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.02);
      border-radius: 12px;
      padding: 14px 16px;
    }

    .meta-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .meta-val {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.3);
        opacity: 0.5;
      }
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="radial-glow"></div>

  <div class="card">
    <div class="logo-container">
      <div class="logo-icon">C</div>
      <div class="logo-text">TruliCares</div>
    </div>
    <br>
    <div>
      <div class="status-badge">
        <span class="status-dot"></span>
        API SERVICE ACTIVE
      </div>
    </div>
    <h1>Backend Service Live</h1>
    <p>The TruliCares Express API cluster is active, connected to the Supabase database pool, and serving routes under serverless micro-runtimes.</p>
    
    <div class="divider"></div>

    <div class="meta-grid">
      <div class="meta-item">
        <div class="meta-label">Environment</div>
        <div class="meta-val">Production</div>
      </div>
      <div class="meta-item">
        <div class="meta-label">Module Routing</div>
        <div class="meta-val">Active (/api/*)</div>
      </div>
    </div>
  </div>
</body>
</html>
